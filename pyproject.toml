[project]
name = "flowsight"
version = "0.1.0"
description = "Delivery-flow signals and AI root-cause insights for GitHub repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "numpy>=2.2",
  "openai>=1.99",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "scipy>=1.15",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["httpx2>=2.16", "mypy>=1.15", "pytest>=8.4", "pytest-asyncio>=1.0", "ruff>=0.12", "scipy-stubs"]

[project.scripts]
flowsight = "flowsight.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC", "PT", "RET", "PL"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
